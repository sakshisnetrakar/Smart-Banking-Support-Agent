<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Banking Support Agent</title>
<style>body{margin:0;background:#eef5f2;font-family:Arial;color:#102c26}main{max-width:760px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #9dc6b580}h1{color:#047857}#chat{height:390px;overflow:auto;border:1px solid #d4e2dc;border-radius:12px;padding:12px}.msg{max-width:85%;padding:10px 12px;margin:10px 0;border-radius:12px;white-space:pre-wrap}.user{background:#d1fae5;margin-left:auto}.bot{background:#f1f5f9}form{display:flex;gap:8px;margin-top:14px}input{flex:1;border:1px solid #b5c9c0;border-radius:8px;padding:12px}button{border:0;border-radius:8px;background:#047857;color:white;padding:12px 18px;cursor:pointer}small{color:#60746d}</style></head>
<body><main><h1>Smart Banking Support Agent</h1><small>Demo only — no real banking data or applications are used.</small><div id="chat"><div class="msg bot">Hello! Tell me about your personal-loan request. I will calculate EMI, check eligibility, verify your demo account, and ask for confirmation before submitting.</div></div><form id="form"><input id="input" required placeholder="I want a personal loan of ₹5,00,000 for three years..."><button>Send</button></form></main>
<script>let id=null;const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.append(d);chat.scrollTop=chat.scrollHeight}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let message=input.value.trim();if(!message)return;add(message,'user');input.value='';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,conversation_id:id})});let x=await r.json();id=x.conversation_id;add(x.answer||x.detail,'bot')};</script></body></html>
